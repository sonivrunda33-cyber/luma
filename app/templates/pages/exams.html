{% extends 'base.html' %}
{% block content %}
<div class="page-heading"><div><span class="eyebrow">PREPARE AT YOUR OWN PACE</span><h1>Exams & courses</h1><p>Keep exam dates visible and make revision feel more manageable.</p></div><div class="heading-actions"><button class="button button-primary" id="addExamButton"><span data-glyph="plus"></span> Add an exam</button></div></div>
<div class="exam-summary" id="examSummary"></div><div class="exam-grid" id="examGrid"></div>
<section class="panel glass-panel courses-panel"><div class="panel-head"><div><h2 class="panel-title">Your courses</h2><p class="panel-subtitle">Track the material you have covered so far</p></div><span class="course-caption">SEMESTER 03</span></div><div class="course-grid" id="courseList"></div></section>
<div class="modal-backdrop" id="examModal" aria-hidden="true"><section class="modal glass-panel" role="dialog" aria-modal="true" aria-labelledby="examModalTitle"><div class="modal-head"><div><span class="eyebrow">KEEP THE DATE IN SIGHT</span><h2 id="examModalTitle">Add an exam</h2></div><button class="icon-button" data-close-modal="examModal" aria-label="Close"><span data-glyph="close"></span></button></div><form id="examForm" class="modal-form"><label class="field"><span>Exam title</span><input name="title" required placeholder="e.g. Mid-semester assessment"></label><div class="field-row"><label class="field"><span>Subject</span><input name="subject" required placeholder="e.g. Statistics"></label><label class="field"><span>Date & time</span><input name="exam_at" type="datetime-local" required></label></div><label class="field"><span>Location <em>optional</em></span><input name="location" placeholder="e.g. Hall B · 204"></label><label class="field"><span>Revision notes <em>optional</em></span><textarea name="notes" rows="2" placeholder="Topics to review…"></textarea></label><div class="modal-actions"><button type="button" class="button button-quiet" data-close-modal="examModal">Cancel</button><button class="button button-primary" type="submit"><span data-glyph="check"></span> Save exam</button></div></form></section></div>
{% endblock %}
